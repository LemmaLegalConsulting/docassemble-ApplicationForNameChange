<!doctype html><html><head><meta charset="utf-8"><title>Live Docker browser tests</title><style>body{margin:0;background:#17212b;color:#fff;font:16px system-ui}header{padding:14px 24px;display:flex;justify-content:space-between}span{color:#93d8b0;font-size:14px}main{text-align:center}img{max-width:100%;height:auto;background:white}p{margin:6px 24px 14px;color:#b8c6d3;font-size:14px}</style></head><body><header><strong>Live Docker browser tests</strong><span id="state">Connecting…</span></header><p id="scenario">Watching the actual automated test browser. It moves between screens and starts a new session for each scenario.</p><main><img id="screen" alt="Live automated browser inside Docker"></main><script>const screen=document.getElementById('screen');const state=document.getElementById('state');async function refresh(){try{const status=await (await fetch('status.json?t='+Date.now(),{cache:'no-store'})).json();document.getElementById('scenario').textContent=status.summary;state.textContent=status.state==='complete'?'Run complete':'Live · updates every second';}catch{}try{const response=await fetch('frame.jpg?t='+Date.now(),{cache:'no-store'});if(response.ok){const url=URL.createObjectURL(await response.blob());const previous=screen.src;screen.src=url;if(previous.startsWith('blob:'))URL.revokeObjectURL(previous);}}catch{}setTimeout(refresh,1000)}refresh();</script></body></html>
