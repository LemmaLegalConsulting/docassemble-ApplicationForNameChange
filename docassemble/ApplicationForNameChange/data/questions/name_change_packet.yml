id: minor only packet help
event: minor_only_help
question: Use the minor name change application
subquestion: |
  Only your children are changing their names. The court has a separate packet for that.
  Use [NAM202 and the minor packet](https://mncourts.gov/getforms/name-change).

  If you also want to change your own name, edit your answer.

  ${ action_button_html(url_action('request_for_applicant_name_change'), label='Edit your name change answer') }
buttons:
  - Restart: restart
