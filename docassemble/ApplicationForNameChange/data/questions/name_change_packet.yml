id: minor only packet help
event: minor_only_help
question: Use the minor name change application
subquestion: |
  The court publishes a separate packet when only minors are requesting name changes.
  Use [NAM202 and the minor packet](https://mncourts.gov/getforms/name-change),
  or get help if you also need an adult birth-record change.
buttons:
  - Restart: restart
