id: download Application_for_name_change
event: Application_for_name_change_download
question: Review and print your name change packet
subquestion: |
  Your forms are ready. **Nothing has been filed with the court yet.** Read every page before you sign.

  ${ action_button_html(url_action('review_Application_for_name_change'), label='Edit answers', color='info') }
  ${ action_button_html(url_action('review_name_change_packet'), label='Edit packet information', color='info') }
  ${ al_user_bundle.download_list_html() }

  Before you file:

  * Sign the application and each criminal history release.
  * Leave the parts of the order for the judge blank.
  * The court will give you the hearing date, time, and place. Write them on any hearing notice.
  * The person who delivers papers to the other parent must fill out the service form.
  % if request_fee_waiver:
  * Keep the fee waiver affidavit separate from your other forms. It is confidential.
  % endif
  * Read the next steps and the court instructions in your packet.

  Learn more: [Name Change - Minnesota Court Forms and Information](https://www.lawhelpmn.org/self-help-library/legal-resource/name-change-minnesota-court-forms-and-information) on LawHelpMN.
progress: 100
