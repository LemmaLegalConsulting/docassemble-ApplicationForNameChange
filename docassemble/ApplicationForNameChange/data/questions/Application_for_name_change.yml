id: Application_for_name_change
continue button field: Application_for_name_change_intro
question: |
  Application for name change
subquestion: |
  Prepare an Application for Name Change and Other Relief (NAM102).
  You can include a spouse or minor children. Gather current names, dates of birth,
  requested names, and any criminal history or Minnesota property interests.

  Prepare the application, criminal-history releases, and proposed order.
  We will add notices, affidavits, and a fee-waiver request when they apply to your answers.
  Read the [court instructions](https://mncourts.gov/help-topics/name-change)
  for filing, notice requirements, and the hearing.

  The application states that everyone requesting a name change has lived in Minnesota
  for at least six months. Get help before signing if that statement is not true.

  Read [Name Change - Minnesota Court Forms and Information](https://www.lawhelpmn.org/self-help-library/legal-resource/name-change-minnesota-court-forms-and-information) on LawHelpMN for more information.
