- New middle name: children3_name_middle_change
  required: false
- New last name: children3_name_last_change
  required: false
---
id: child 4 requested name
question: What name are you requesting for ${ children[3] }?
subquestion: |
  Type ${ children[3].name.first }'s full new name. If this child is not changing their name, leave all 3 boxes blank.
fields:
- New first name: children4_name_first_change
  required: false
