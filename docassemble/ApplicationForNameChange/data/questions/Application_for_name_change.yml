---
id: Non Applicant Parent Information
question: Tell us about your children’s other parent
subquestion: |
  The court must tell the other parent about your application.
  This interview works for one other parent shared by all the children applying.
fields:
- Which is true?: parents_nonapplicant_unknown
  datatype: radio
  choices:
  - I know who the other parent is, or their name is on the birth certificate: false
  - The other parent is unknown, and no other parent is named on the birth certificate: true
- First name: parents_nonapplicant_name_first
  show if:
    variable: parents_nonapplicant_unknown
    is: false
- Middle name (optional): parents_nonapplicant_name_middle
  required: false
  show if:
    variable: parents_nonapplicant_unknown
    is: false
- Last name: parents_nonapplicant_name_last
  show if:
    variable: parents_nonapplicant_unknown
    is: false
- Do you know the other parent’s address?: parent_address_known
  datatype: yesnoradio
  show if:
    variable: parents_nonapplicant_unknown
    is: false
  help: |
    If you do not know the address, you can ask the court for permission to publish a notice.
    The notice goes in a newspaper. You will need to explain how you tried to find the parent.
- Street address: parents_nonapplicant_address_address
  show if: parent_address_known
- City, state, and ZIP code: parents_nonapplicant_city_state_zip
  show if: parent_address_known
