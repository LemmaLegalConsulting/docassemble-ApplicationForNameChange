id: Other Relevant Information
question: Does anyone applying own or have a claim to land in Minnesota?
subquestion: |
  For example, they own a house or land, or have a lien or mortgage on someone else’s property.
fields:
- no label: applicant_spouse_or_children_have_claim_interest_or_lien_in_Minnesota
  input type: radio
  choices:
  - 'Yes': parties_have_claim_interest_or_lien
  - 'No': parties_do_not_have_claim_interest_or_lien
- Name of each person and the legal description of the land: name_of_person_and_description_of_person_with_claim_interest_or_lien
  input type: area
  help: The legal description is on the deed or the property tax statement.
  show if:
    variable: applicant_spouse_or_children_have_claim_interest_or_lien_in_Minnesota
    is: parties_have_claim_interest_or_lien
---
id: additional circumstances
question: Do any of these apply to you?
fields:
- Are you in a victim or witness protection program?: users1_involved_in_victim_or_witness_protection
  datatype: yesnoradio
- Are you in a prison, jail, or other correctional facility now?: users1_inmate_in_correctional_facility_and_submitting_inmate_aff
  datatype: yesnoradio
  help: If yes, we will also prepare the Inmate Affidavit for Name Change (NAM105).
- Are you divorced and only changing back to the name on your birth certificate?: users1_divorced_seeking_change_to_legal_name_on_birth_certificate
  datatype: yesnoradio
  help: This is called the divorce exception. You must file certified copies of your divorce
    decree and your birth certificate. Read NAM101 to learn more.
---
id: other statements
question: Is there anything else you want the court to know?
fields:
- Other information for the court (optional): users1_other_statements
  input type: area
  required: false
---
id: Signatures
question: Where will you sign the application?
subquestion: You can leave these blank and fill them in by hand when you sign.
fields:
- County and state where you will sign (optional): county_and_state_where_signed
  required: false
- Name of each child age 14 or older who will sign (optional): minor_fourteen_years_old_name_full
  required: false
---
code: |
  signature_fields = []
---
