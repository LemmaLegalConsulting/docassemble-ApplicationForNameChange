comment: |
  This block includes the logic for standalone interviews.
  Delete mandatory: True to include in another interview
mandatory: true
code: |
  al_intro_screen
  Application_for_name_change_intro
  user_role = "na"
  user_ask_role = "na"
  users.gather()
  users[0].birthdate
  if users[0].age_in_years() < 18:
    adult_applicant_help
  all_applicants_resident_six_months
  if not all_applicants_resident_six_months:
    residency_help
  users[0].address.address
  users[0].address.county
  users[0].phone_number
  users[0].email
  interpreter_request
  district_court_county
  request_for_applicant_name_change
  request_for_applicant_name_change_on_birth_record
  request_sex_change_on_birth_record
  replacement_birth_record
  not_married
  if not not_married:
    spouses.gather()
    spouses[0].birthdate
    if application_includes_spouse == "yes_includes_spouse":
      request_applicant_spouse_name_change
      spouses[0].address.address
      spouses[0].phone_number
      spouses[0].email
  no_minor_children
  if not no_minor_children:
    children.gather()
    if children.number_gathered() > 5:
      children_extra_sheet
    minor_children_listed_not_included_in_application
    if minor_children_listed_not_included_in_application == "minor_children_included_yes":
      request_childrens_name_change
      if request_childrens_name_change:
        for index in range(min(children.number_gathered(), 5)):
          value("children" + str(index + 1) + "_name_first_change")
  no_nonapplicant_parent = no_minor_children or minor_children_listed_not_included_in_application != "minor_children_included_yes"
  if not no_nonapplicant_parent:
    parents_nonapplicant_unknown
    if not parents_nonapplicant_unknown:
      parents_nonapplicant_name_first
      parent_address_known
  parties_have_criminal_history
  no_parties_have_criminal_history = not parties_have_criminal_history
  if parties_have_criminal_history:
    criminal_history
    parties_with_criminal_history
    if parties_with_criminal_history:
      felony_count
      for index in range(felony_count):
        value("party" + str(index + 1) + "_with_offense")
  applicant_spouse_or_children_have_claim_interest_or_lien_in_Minnesota
  users1_involved_in_victim_or_witness_protection
  users1_other_statements
  county_and_state_where_signed
  spouse_included = not not_married and application_includes_spouse == "yes_includes_spouse"
  applicant_requested_name = " ".join(part for part in [users1_name_first_change, users1_name_middle_change, users1_name_last_change] if part.strip()) if request_for_applicant_name_change else ""
  birth_requested_name = " ".join(part for part in [users1_name_first_change_birth_record, users1_name_middle_change_birth_record, users1_name_last_change_birth_record] if part.strip()) if request_for_applicant_name_change_on_birth_record else ""
  spouse_requested_name = " ".join(part for part in [spouses_name_first_change, spouses_name_middle_change, spouses_name_last_change] if part.strip()) if spouse_included and request_applicant_spouse_name_change else ""
  included_children = []
  child_requested_pairs = []
  if not no_minor_children and minor_children_listed_not_included_in_application == "minor_children_included_yes" and request_childrens_name_change:
    for index, child in enumerate(children):
      if index < 5:
        requested = " ".join(value("children" + str(index + 1) + "_name_" + part + "_change") for part in ["first", "middle", "last"]).strip()
        if requested:
          included_children.append(child)
          child_requested_pairs.append((child.name.full(), requested))
  if child_requested_pairs and not (applicant_requested_name or spouse_requested_name):
    minor_only_help
  if not (applicant_requested_name or birth_requested_name or request_sex_change_on_birth_record or replacement_birth_record or spouse_requested_name or child_requested_pairs):
    no_relief_help
  included_children_names = "; ".join(child.name.full() for child in included_children)
  children_requested_names = "; ".join(pair[1] for pair in child_requested_pairs)
  children_requested_summary = "; ".join(old + " → " + new for old, new in child_requested_pairs)
  minor_children_included_names = included_children_names
  listed_children_summary = "; ".join(child.name.full() + "; " + child.birthdate.format() for child in children) if not no_minor_children else "None"
  listed_spouse_summary = spouses[0].name.full() + "; " + spouses[0].birthdate.format() if not not_married else "None"
  packet_people = [users[0]] + ([spouses[0]] if spouse_included else []) + included_children
  packet_new_names = [applicant_requested_name or users[0].name.full()] + ([spouse_requested_name or spouses[0].name.full()] if spouse_included else []) + [pair[1] for pair in child_requested_pairs]
  packet_caption = "; ".join(person.name.full() for person in packet_people)
  packet_requested_caption = "; ".join(packet_new_names)
  hennepin_packet = district_court_county.strip().lower().removesuffix(" county") == "hennepin"
  order_people = []
  if hennepin_packet:
    if applicant_requested_name or birth_requested_name or request_sex_change_on_birth_record or replacement_birth_record:
      order_people.append({"caption": users[0].name.full(), "requested_caption": packet_new_names[0], "primary": True, "spouse": False, "children": ""})
    if spouse_requested_name:
      order_people.append({"caption": spouses[0].name.full(), "requested_caption": spouse_requested_name, "primary": False, "spouse": True, "children": ""})
    for old, new in child_requested_pairs:
      order_people.append({"caption": old, "requested_caption": new, "primary": False, "spouse": False, "children": old + " → " + new})
  else:
    order_people.append({"caption": packet_caption, "requested_caption": packet_requested_caption, "primary": True, "spouse": bool(spouse_requested_name), "children": children_requested_summary})
  omit_former_name = replacement_birth_record and keep_former_name_confidential
  omit_former_sex = replacement_birth_record and keep_former_sex_confidential
  has_felony = parties_have_criminal_history and parties_with_criminal_history
  felony_summary = "; ".join(value("party" + str(index + 1) + "_with_offense") + ": " + value("party" + str(index + 1) + "_name_of_offense") + ", " + value("party" + str(index + 1) + "_date_of_offense") + ", " + value("party" + str(index + 1) + "_state_of_offense") for index in range(felony_count)) if has_felony else ""
  land_summary = name_of_person_and_description_of_person_with_claim_interest_or_lien if applicant_spouse_or_children_have_claim_interest_or_lien_in_Minnesota == "parties_have_claim_interest_or_lien" else "None"
  if users1_divorced_seeking_change_to_legal_name_on_birth_certificate:
    divorce_exception_confirmed
    if not divorce_exception_confirmed or has_felony or len(packet_people) != 1:
      divorce_exception_help
  release_people = [person for person in packet_people if person.age_in_years() >= 10 and not users1_divorced_seeking_change_to_legal_name_on_birth_certificate]
  for person in release_people:
    person.release_other_names
    person.release_sex
    person.release_race
  felony_notice_data = []
  if has_felony:
    court_administrator_address
    for index in range(felony_count):
      felony_notices[index].person_index
      felony_notices[index].kind
      felony_notices[index].authority
      felony_notice_data.append({"current_name": packet_people[felony_notices[index].person_index].name.full(), "requested_name": packet_new_names[felony_notices[index].person_index], "kind": felony_notices[index].kind, "authority": felony_notices[index].authority})
  if users1_inmate_in_correctional_facility_and_submitting_inmate_aff:
    inmate_prior_name_change_request
    if inmate_prior_name_change_request:
      inmate_repeat_help
    inmate_name_change_reason
  parental_notice_needed = bool(included_children) and not parents_nonapplicant_unknown
  if included_children and parents_nonapplicant_unknown:
    unidentified_parent_conditions_confirmed
    if not unidentified_parent_conditions_confirmed:
      unidentified_parent_help
  nonapplicant_parent_name = " ".join([parents_nonapplicant_name_first, parents_nonapplicant_name_middle, parents_nonapplicant_name_last]) if parental_notice_needed else ""
  if parental_notice_needed and not parent_address_known:
    parent_last_location
    parent_last_employment
    parent_relatives
    parent_search_efforts
  request_fee_waiver
  if request_fee_waiver and users1_inmate_in_correctional_facility_and_submitting_inmate_aff:
    inmate_fee_waiver_help
  if request_fee_waiver and not users1_inmate_in_correctional_facility_and_submitting_inmate_aff:
    fee_legal_services
    if fee_legal_services:
      fee_lawyer_name
    else:
      fee_public_assistance
      if fee_public_assistance == "other":
        fee_other_program
      if fee_public_assistance != "listed":
        fee_household_size
        fee_household_members
        fee_income_sources
        fee_monthly_income
        if not not_married:
          fee_spouse_income_known
          if fee_spouse_income_known:
            fee_spouse_monthly_income
          else:
            fee_spouse_income_unknown_reason
        fee_other_household_income
        fee_yearly_income
        if not fee_below_poverty_guideline:
          fee_expenses
          fee_debt
          fee_assets
          fee_other_reasons
  fee_financial_details = request_fee_waiver and not users1_inmate_in_correctional_facility_and_submitting_inmate_aff and not fee_legal_services and fee_public_assistance != "listed"
  fee_full_details = fee_financial_details and not fee_below_poverty_guideline
  Personal_service_instructions.enabled = parental_notice_needed and parent_address_known
  Publication_instructions.enabled = parental_notice_needed and not parent_address_known
  Fee_waiver_instructions.enabled = request_fee_waiver
  Hennepin_name_change_instructions.enabled = hennepin_packet
  Inmate_fee_waiver_form.enabled = request_fee_waiver and users1_inmate_in_correctional_facility_and_submitting_inmate_aff
  Criminal_history_releases.enabled = bool(release_people)
  Felony_name_change_notices.enabled = has_felony
  Inmate_name_change_affidavit.enabled = users1_inmate_in_correctional_facility_and_submitting_inmate_aff
  Parental_hearing_notice.enabled = parental_notice_needed
  Parental_personal_service.enabled = parental_notice_needed and parent_address_known
  Parental_publication_request.enabled = parental_notice_needed and not parent_address_known
  Fee_waiver_affidavit.enabled = request_fee_waiver and not users1_inmate_in_correctional_facility_and_submitting_inmate_aff
  Application_for_name_change_download
---
comment: |
  This question is used to introduce your interview. Please customize
id: Application_for_name_change
continue button field: Application_for_name_change_intro
question: |
  Apply for a Minnesota name change
subquestion: |
  This interview prepares the forms an adult needs to ask the court for a name change.
  You can also include your spouse and up to 5 children under 18.

  We will prepare the Application for Name Change (NAM102), criminal history releases,
  and a proposed order. We will add other forms if your answers show you need them.

  Have this information ready:

  * Current names, new names, and birth dates for everyone applying
  * Any criminal history
  * Any land in Minnesota that someone applying owns or has a claim to

  ${ collapse_template(name_change_limits_template) }

  Read [Name Change - Minnesota Court Forms and Information](https://www.lawhelpmn.org/self-help-library/legal-resource/name-change-minnesota-court-forms-and-information) on LawHelpMN for more information.
---
template: name_change_limits_template
subject: |
  What this interview cannot do
content: |
  * If only children under 18 need a name change, use the [court’s minor packet](https://mncourts.gov/getforms/name-change).
  * If you have more than 5 children, more than 5 felony offenses, or children with different
    other parents, you will need extra forms or help from court administration.

  Read the [court instructions](https://mncourts.gov/help-topics/name-change)
  to learn about filing, giving notice, and the hearing.
---
id: Interpreter
question: Interpreter
fields:
- Do you need an interpreter at the hearing?: interpreter_request
  datatype: yesnoradio
- Language: interpreter_language
  show if: interpreter_request
---
id: Court Information
question: Which county will you file in?
subquestion: |
  Most people file in the county where they live.
fields:
- County: district_court_county
  datatype: dropdown
  code: minnesota_counties
  default: ${ users[0].address.county }
- Court file number (optional): docket_number
  required: false
  help: You only have a court file number if you already have a case. Most people leave this blank.
---
id: Requesting your name change
question: Your new name
subquestion: If yes, type your full new name. Include any parts that will stay the same.
fields:
- Do you want to change your name?: request_for_applicant_name_change
  datatype: yesnoradio
- New first name: users1_name_first_change
  show if: request_for_applicant_name_change
- New middle name (optional): users1_name_middle_change
  required: false
  show if: request_for_applicant_name_change
- New last name: users1_name_last_change
  show if: request_for_applicant_name_change
---
id: Birth Record
question: Name on your birth record
subquestion: If yes, use either your current name or the new name you asked for.
fields:
- Do you want to change the name on your birth record?: request_for_applicant_name_change_on_birth_record
  datatype: yesnoradio
- First name for birth record: users1_name_first_change_birth_record
  show if: request_for_applicant_name_change_on_birth_record
- Middle name for birth record (optional): users1_name_middle_change_birth_record
  required: false
  show if: request_for_applicant_name_change_on_birth_record
- Last name for birth record: users1_name_last_change_birth_record
  show if: request_for_applicant_name_change_on_birth_record
---
id: birth record sex
question: Sex on your birth record
fields:
- Do you want to change the sex listed on your birth record?: request_sex_change_on_birth_record
  datatype: yesnoradio
- Sex now listed on your birth record: sex_current
  show if: request_sex_change_on_birth_record
- New sex for your birth record: sex_change
  show if: request_sex_change_on_birth_record
---
id: replacement birth record
question: Replacement birth record
fields:
- Do you want a replacement birth record?: replacement_birth_record
  datatype: yesnoradio
  help: The Minnesota Department of Health can issue a new birth record to replace your old one.
- Leave your former name off the new record and keep the old record private?: keep_former_name_confidential
  datatype: yesnoradio
  show if: replacement_birth_record
- Leave your former sex off the new record and keep the old record private?: keep_former_sex_confidential
  datatype: yesnoradio
  show if: replacement_birth_record
---
id: Spouse Information
question: Your spouse
fields:
- Are you married?: not_married
  datatype: radio
  choices:
  - 'Yes': false
  - 'No': true
- Is your spouse applying for a name change with you?: application_includes_spouse
  input type: radio
  choices:
  - 'Yes': yes_includes_spouse
  - 'No': no_includes_spouse
  show if:
    variable: not_married
    is: false
---
id: spouse requested name
question: Your spouse's new name
subquestion: If yes, type your spouse's full new name. Include any parts that will stay the same.
fields:
- Does your spouse want to change their name?: request_applicant_spouse_name_change
  datatype: yesnoradio
- Spouse's new first name: spouses_name_first_change
  show if: request_applicant_spouse_name_change
- Spouse's new middle name (optional): spouses_name_middle_change
  required: false
  show if: request_applicant_spouse_name_change
- Spouse's new last name: spouses_name_last_change
  show if: request_applicant_spouse_name_change
---
id: Children Information
question: Do you have any children under 18?
fields:
- no label: no_minor_children
  datatype: radio
  choices:
