  can_I_use_this_form: |
    This interview starts with an adult asking for a name or birth-record change.
    An adult spouse and up to five children may be included for name changes.
    Changes only for minors use a separate court packet.
  before_you_start: |
    Gather current and requested names, birth dates, family information, criminal history,
    and any Minnesota property interests. If children are included, gather information
    about their other parent. A fee-waiver request may require financial records.
