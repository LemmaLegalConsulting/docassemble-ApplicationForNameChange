id: Application for name change review screen
event: review_Application_for_name_change
question: |
  Review your answers
review:
- Edit: users[0].name.first
  button: |
    **Your name:** ${ users[0] }
- Edit: users[0].birthdate
  button: |
    **Your birth date:** ${ users[0].birthdate.format() }
- Edit: users[0].address.address
  button: |
    **Your address:** ${ users[0].address.on_one_line() }
- Edit: users[0].address.county
  button: |
    **Your county:** ${ users[0].address.county }
- Edit: interpreter_request
  button: |
    **Interpreter:** ${ interpreter_language if interpreter_request else "Not needed" }
- Edit: district_court_county
  button: |
    **County where you will file:** ${ district_court_county }
- Edit: request_for_applicant_name_change
  button: |
    **Your new name:** ${ applicant_requested_name if request_for_applicant_name_change else "No change" }
- Edit: request_for_applicant_name_change_on_birth_record
  button: |
    **Name on birth record:** ${ birth_requested_name if request_for_applicant_name_change_on_birth_record else "No change" }
- Edit: request_sex_change_on_birth_record
  button: |
    **Sex on birth record:** ${ sex_change if request_sex_change_on_birth_record else "No change" }
- Edit: replacement_birth_record
  button: |
    **Replacement birth record:** ${ yesno(replacement_birth_record) }
- Edit: not_married
  button: |
    **Married:** ${ "No" if not_married else "Yes" }
- Edit: spouses.revisit
  button: |
    **Spouse:** ${ spouses[0] }
  show if: not not_married
- Edit: request_applicant_spouse_name_change
  button: |
    **Spouse's new name:** ${ spouse_requested_name or "No change" }
  show if: not not_married and application_includes_spouse == "yes_includes_spouse"
- Edit: no_minor_children
  button: |
    **Children under 18:** ${ "None" if no_minor_children else comma_and_list(children) }
- Edit: children.revisit
  button: |
    Edit your children's names and birth dates
  show if: not no_minor_children
- Edit: minor_children_listed_not_included_in_application
  button: |
    **Children applying with you:** ${ "Yes" if minor_children_listed_not_included_in_application == "minor_children_included_yes" else "No" }
  show if: not no_minor_children
- Edit: children1_name_first_change
  show if: not no_minor_children and children.number_gathered() > 0 and minor_children_listed_not_included_in_application == "minor_children_included_yes" and request_childrens_name_change
  button: |
    **New name for child 1:** ${ " ".join(value("children1_name_" + part + "_change") for part in ["first", "middle", "last"]).strip() or "No change" }
- Edit: children2_name_first_change
  show if: not no_minor_children and children.number_gathered() > 1 and minor_children_listed_not_included_in_application == "minor_children_included_yes" and request_childrens_name_change
  button: |
    **New name for child 2:** ${ " ".join(value("children2_name_" + part + "_change") for part in ["first", "middle", "last"]).strip() or "No change" }
- Edit: children3_name_first_change
  show if: not no_minor_children and children.number_gathered() > 2 and minor_children_listed_not_included_in_application == "minor_children_included_yes" and request_childrens_name_change
  button: |
    **New name for child 3:** ${ " ".join(value("children3_name_" + part + "_change") for part in ["first", "middle", "last"]).strip() or "No change" }
- Edit: children4_name_first_change
  show if: not no_minor_children and children.number_gathered() > 3 and minor_children_listed_not_included_in_application == "minor_children_included_yes" and request_childrens_name_change
  button: |
    **New name for child 4:** ${ " ".join(value("children4_name_" + part + "_change") for part in ["first", "middle", "last"]).strip() or "No change" }
- Edit: children5_name_first_change
  show if: not no_minor_children and children.number_gathered() > 4 and minor_children_listed_not_included_in_application == "minor_children_included_yes" and request_childrens_name_change
  button: |
    **New name for child 5:** ${ " ".join(value("children5_name_" + part + "_change") for part in ["first", "middle", "last"]).strip() or "No change" }
- Edit: parents_nonapplicant_unknown
  button: |
    **Children's other parent:** ${ "Unknown" if parents_nonapplicant_unknown else parents_nonapplicant_name_first + " " + parents_nonapplicant_name_last }
  show if: not no_nonapplicant_parent
- Edit: parties_have_criminal_history
  button: |
    **Criminal record:** ${ yesno(parties_have_criminal_history) }
- Edit: criminal_history
  button: |
    **Felony conviction:** ${ yesno(parties_with_criminal_history) }
  show if: parties_have_criminal_history
- Edit: felony_count
  show if: parties_have_criminal_history and parties_with_criminal_history
  button: |
    **Number of felony offenses:** ${ felony_count }
- Edit: party1_with_offense
  show if: parties_have_criminal_history and parties_with_criminal_history and felony_count > 0
  button: |
    **Felony offense 1:** ${ party1_with_offense }, ${ party1_name_of_offense }
- Edit: party2_with_offense
  show if: parties_have_criminal_history and parties_with_criminal_history and felony_count > 1
  button: |
    **Felony offense 2:** ${ party2_with_offense }, ${ party2_name_of_offense }
- Edit: party3_with_offense
  show if: parties_have_criminal_history and parties_with_criminal_history and felony_count > 2
  button: |
    **Felony offense 3:** ${ party3_with_offense }, ${ party3_name_of_offense }
- Edit: party4_with_offense
  show if: parties_have_criminal_history and parties_with_criminal_history and felony_count > 3
  button: |
    **Felony offense 4:** ${ party4_with_offense }, ${ party4_name_of_offense }
- Edit: party5_with_offense
  show if: parties_have_criminal_history and parties_with_criminal_history and felony_count > 4
  button: |
    **Felony offense 5:** ${ party5_with_offense }, ${ party5_name_of_offense }
- Edit: applicant_spouse_or_children_have_claim_interest_or_lien_in_Minnesota
  button: |
    **Land in Minnesota:** ${ "Yes" if applicant_spouse_or_children_have_claim_interest_or_lien_in_Minnesota == "parties_have_claim_interest_or_lien" else "No" }
- Edit: users1_involved_in_victim_or_witness_protection
  button: |
    Victim or witness protection, correctional facility, and divorce exception
- Edit: users1_other_statements
  button: |
    **Other information for the court:** ${ users1_other_statements or "None" }
- Edit: county_and_state_where_signed
  button: |
    **Where you will sign:** ${ county_and_state_where_signed or "Fill in by hand" }
---
